# SINTRAN III Monitor Call: DefineBreakpoint
# Octal: 45B
# Reverse-engineered from SINTRAN III NPL source + ND-860228-2-EN manual (section 2.14).
# The manual lists this call name-only (internal use); contract below is RE-derived.

octal: 45B
name: DefineBreakpoint
short_names:
- DBRK
description: >-
  ND-100 debug breakpoint monitor call (internal use, manual section 2.14).
  Dispatched via GOTAB[45B]=MFELL (MP-P2-2.NPL) to monitor level, then through
  CALLPROC (dispatch module absent from source) to the debugger. Two readable
  handler bodies exist: DEBUGGER (RP-P2-MONCALLS.NPL:2043), a routine with a
  16-entry subfunction GOSW, and BRPNT (RP-P2-MONCALLS.NPL:1965), the
  breakpoint-trap handler. Symbols (M06): BRPNT=105544, DEBUG=106065.
notes:
- Internal-use monitor call (manual section 2.14); not intended for user programs.
- DEBUGGER exposes 16 subfunctions selected by an index in the caller's T-register
  GOSW - 0 GETDSEG (get data segment), 1 PLAC1 (place), 2 PSTART (start program),
  3 READLOC (read location), 4 WRITLOC (write location), 5 RELDSEG (release data
  segment), 6 RTGDBSEG (RT debug segment), 7 CHLGSEG (check legal segment),
  8 RRGBLOCK (read register block), 9 WRGBLOCK (write register block),
  10 STRRT (start RT-program), 13 DWPERMIT (segment write-permit),
  14 DWPROTECT (segment write-protect), 15 PLREENTRANT (place reentrant).
- UNCERTAIN - the exact MON-number -> handler binding for 45/46/47/51 is NOT present
  in the NPL source tree; it lives in the absent monitor-level CALLPROC dispatch.
  It is therefore uncertain which of these numbers selects DEBUGGER versus BRPNT.
- The requester notes that MON 45 is DBRK on the ND-100 but GTYPR (GetTypeRing,
  equivalent to MON 327 function 4) on the ND-500 side; the number is reused across
  the two processors.
- Caller signature (CALLG/T-reg contents) is unverified; no confirmed parameter block.
